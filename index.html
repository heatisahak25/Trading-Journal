<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1325;
            --card-bg: rgba(21, 32, 54, 0.95);
            --accent-gold: #f3ba2f;
            --accent-green: #00e676;
            --accent-red: #ff3366;
            --text-main: #ffffff;
            --text-sub: #8a99ad;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background: #080d1a;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px 10px;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating background orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.12;
            animation: floatGlow 25s infinite alternate ease-in-out;
            pointer-events: none;
        }

        body::before {
            background: var(--accent-gold);
            top: 10%;
            left: 5%;
        }

        body::after {
            background: var(--accent-green);
            bottom: 10%;
            right: 5%;
            animation-delay: -12s;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(80px, 40px) scale(1.15);
            }
            100% {
                transform: translate(-40px, 80px) scale(0.85);
            }
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            background: rgba(21, 32, 54, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .header {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .header h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            background: rgba(243, 186, 47, 0.08);
            border: 1px solid rgba(243, 186, 47, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(243, 186, 47, 0.05);
        }

        .progress-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00c6ff, var(--accent-green));
            transition: width 0.4s ease;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }

        .btn-add:hover {
            box-shadow: 0 0 15px rgba(243, 186, 47, 0.4);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-add { background: var(--accent-gold); color: #000; }
        .btn-reset { background: rgba(255, 255, 255, 0.08); color: var(--text-sub); }

        /* Modal Overlay & Box */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-box {
            background: #152238;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--accent-gold); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);

            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }

        /* Table */
        .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: rgba(255, 255, 255, 0.04); color: var(--text-sub); padding: 10px; font-size: 11px; }
        td { padding: 10px; font-size: 13px; border-bottom: 1px solid var(--border-color); color: #d1d5db; }
        tr.completed td { color: var(--accent-green); background: rgba(0, 230, 118, 0.05); }

        /* Responsive Titles */
        .mobile-title { display: none; }
        .desktop-title { display: inline; }

        /* Status Column Buttons */
        .status-container {
            display: inline-flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .status-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: transparent;
            font-size: 11px;
            font-weight: 800;
            padding: 0;
            line-height: 1;
            user-select: none;
            touch-action: manipulation;
        }

        .status-btn.btn-win:hover {
            border-color: var(--accent-green);
            background: rgba(0, 230, 118, 0.1);
        }

        .status-btn.btn-win.active {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
            transform: scale(1.08);
        }

        .status-btn.btn-loss:hover {
            border-color: var(--accent-red);
            background: rgba(255, 51, 102, 0.1);
        }

        .status-btn.btn-loss.active {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
            transform: scale(1.08);
        }

        .status-btn:active {
            transform: scale(0.9);
        }

        /* Row Highlights */
        tr.completed-win td {
            background: rgba(0, 230, 118, 0.03);
        }
        tr.completed-loss td {
            background: rgba(255, 51, 102, 0.03);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            margin: 0 4px;
            font-size: 14px;
            transition: transform 0.15s ease, color 0.15s ease;
            display: inline-block;
        }
        .action-btn:hover {
            color: var(--text-main);
            transform: scale(1.2);
        }
        .action-btn:active {
            transform: scale(0.9);
        }

        /* Modal Slide-up Animation */
        .modal-box {
            animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalSlideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Mobile Media Queries */
        @media (max-width: 480px) {
            .mobile-title { display: inline; }
            .desktop-title { display: none; }
            
            body {
                padding: 10px 6px;
            }
            .app-container {
                padding: 12px 10px;
                border-radius: 16px;
            }
            .header h1 {
                font-size: 16px;
            }
            .progress-card {
                padding: 10px;
                margin-bottom: 15px;
            }
            .progress-info {
                font-size: 11px;
                margin-bottom: 6px;
            }
            .controls {
                gap: 8px;
                margin-bottom: 15px;
            }
            .btn {
                padding: 10px 8px;
                font-size: 12px;
                border-radius: 8px;
            }
            th, td {
                padding: 6px 3px;
                font-size: 11px;
                white-space: nowrap;
            }
            .action-btn {
                margin: 0 1px;
                font-size: 11px;
            }
            .status-container {
                gap: 5px;
            }
            .status-btn {
                width: 18px;
                height: 18px;
                font-size: 8px;
            }
            .modal-box {
                padding: 15px;
                border-radius: 12px;
            }
            .modal-title {
                font-size: 14px;
                margin-bottom: 10px;
            }
            .form-group {
                margin-bottom: 8px;
            }
            .form-group input {
                padding: 8px;
                font-size: 13px;
            }
            body::before, body::after {
                width: 180px;
                height: 180px;
                filter: blur(50px);
                opacity: 0.15;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>ONE MONTH TRADING JOURNAL</h1>
        <div class="subtitle">STRATEGY: BBMA</div>
    </div>

    <div class="progress-card">
        <div class="progress-info">
            <span id="progressText">0/30 Days Complete</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- Main Buttons -->
    <div class="controls">
        <button class="btn btn-add" id="openModalBtn">+ បន្ថែមថ្ងៃថ្មី (Add Day)</button>
        <button class="btn btn-reset" id="resetBtn">Clear Checkmarks</button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>DAY</th>
                    <th><span class="desktop-title">BALANCE</span><span class="mobile-title">BAL</span></th>
                    <th><span class="desktop-title">TARGET</span><span class="mobile-title">TGT</span></th>
                    <th><span class="desktop-title">EXPECTED</span><span class="mobile-title">EXP</span></th>
                    <th><span class="desktop-title">STATUS</span><span class="mobile-title">OK</span></th>
                    <th><span class="desktop-title">ACTION</span><span class="mobile-title">ACT</span></th>
                </tr>
            </thead>
            <tbody id="journalBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal Form -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">បន្ថែមថ្ងៃថ្មី (Add New Day)</div>
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group">
            <label>DAY</label>
            <input type="number" id="inputDay" placeholder="ឧ. 31">
        </div>
        <div class="form-group">
            <label>BALANCE ($)</label>
            <input type="text" id="inputBalance" placeholder="ឧ. $10">
        </div>
        <div class="form-group">
            <label>PROFIT TARGET ($)</label>
            <input type="text" id="inputTarget" placeholder="ឧ. $2.50">
        </div>
        <div class="form-group">
            <label>EXPECTED BALANCE ($)</label>
            <input type="text" id="inputExpected" placeholder="ឧ. $12.50">
        </div>
        <div class="modal-actions">
            <button class="btn btn-reset" onclick="closeModal()">បោះបង់</button>
            <button class="btn btn-add" onclick="saveRow()">រក្សាទុក</button>
        </div>
    </div>
</div>

<script>
    const defaultData = [
        { day: 1, balance: "$10", target: "$2.50", expected: "$12.50" },
        { day: 2, balance: "$12.50", target: "$3.13", expected: "$15.63" },
        { day: 3, balance: "$15.63", target: "$3.90", expected: "$19.53" },
        { day: 4, balance: "$19.53", target: "$4.88", expected: "$24.41" },
        { day: 5, balance: "$24.41", target: "$6.10", expected: "$30.51" },
        { day: 6, balance: "$30.51", target: "$7.63", expected: "$38.14" },
        { day: 7, balance: "$38.14", target: "$9.54", expected: "$47.68" },
        { day: 8, balance: "$47.68", target: "$11.92", expected: "$59.60" },
        { day: 9, balance: "$59.60", target: "$14.90", expected: "$74.50" },
        { day: 10, balance: "$74.50", target: "$18.63", expected: "$93.13" },
        { day: 11, balance: "$93.13", target: "$23.28", expected: "$116.41" },
        { day: 12, balance: "$116.41", target: "$29.10", expected: "$145.57" },
        { day: 13, balance: "$145.57", target: "$36.39", expected: "$181.96" },
        { day: 14, balance: "$181.96", target: "$45.49", expected: "$227.45" },
        { day: 15, balance: "$227.45", target: "$56.86", expected: "$284.31" },
        { day: 16, balance: "$284.31", target: "$71.08", expected: "$355.39" },
        { day: 17, balance: "$355.39", target: "$88.85", expected: "$444.24" },
        { day: 18, balance: "$444.24", target: "$111.06", expected: "$555.30" },
        { day: 19, balance: "$555.30", target: "$138.83", expected: "$694.13" },
        { day: 20, balance: "$694.13", target: "$173.53", expected: "$867.66" },
        { day: 21, balance: "$867.66", target: "$216.93", expected: "$1084.54" },
        { day: 22, balance: "$1084.54", target: "$271.15", expected: "$1355.73" },
        { day: 23, balance: "$1355.73", target: "$338.93", expected: "$1694.66" },
        { day: 24, balance: "$1694.66", target: "$423.67", expected: "$2118.33" },
        { day: 25, balance: "$2118.33", target: "$529.58", expected: "$2647.91" },
        { day: 26, balance: "$2647.91", target: "$661.98", expected: "$3309.89" },
        { day: 27, balance: "$3309.89", target: "$827.47", expected: "$4137.36" },
        { day: 28, balance: "$4137.36", target: "$1034.34", expected: "$5171.70" },
        { day: 29, balance: "$5171.70", target: "$1292.93", expected: "$6464.63" },
        { day: 30, balance: "$6464.63", target: "$1616.60", expected: "$8080.79" }
    ];

    let tradingData = JSON.parse(localStorage.getItem('tradingData')) || defaultData;
    let checkedDays = JSON.parse(localStorage.getItem('checkedDays')) || {};

    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Event Listeners for Touch & Click
    openModalBtn.addEventListener('click', () => openModal());
    resetBtn.addEventListener('click', () => resetProgress());

    function renderTable() {
        const tbody = document.getElementById('journalBody');
        tbody.innerHTML = '';
        let completedCount = 0;

        tradingData.forEach((item, index) => {
            const status = checkedDays[item.day];
            const isCompleted = status === 'win' || status === 'loss';
            if (isCompleted) completedCount++;

            const row = document.createElement('tr');
            if (status === 'win') {
                row.classList.add('completed-win');
            } else if (status === 'loss') {
                row.classList.add('completed-loss');
            }

            row.innerHTML = `
                <td><strong>${item.day}</strong></td>
                <td>${item.balance}</td>
                <td>${item.target}</td>
                <td>${item.expected}</td>
                <td>
                    <div class="status-container">
                        <button class="status-btn btn-win ${status === 'win' ? 'active' : ''}" onclick="toggleStatus(${item.day}, 'win')">✓</button>
                        <button class="status-btn btn-loss ${status === 'loss' ? 'active' : ''}" onclick="toggleStatus(${item.day}, 'loss')">✕</button>
                    </div>
                </td>
                <td>
                    <button class="action-btn" onclick="editRow(${index})">✏️</button>
                    <button class="action-btn" onclick="deleteRow(${index})">🗑️</button>
                </td>
            `;
            tbody.appendChild(row);
        });

        updateProgress(completedCount, tradingData.length);
        localStorage.setItem('tradingData', JSON.stringify(tradingData));
    }

    function toggleStatus(day, statusType) {
        if (checkedDays[day] === statusType) {
            delete checkedDays[day];
        } else {
            checkedDays[day] = statusType;
        }
        localStorage.setItem('checkedDays', JSON.stringify(checkedDays));
        renderTable();
    }

    function updateProgress(completed, total) {
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById('progressText').innerText = `${completed}/${total} Days Complete`;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function openModal(index = -1) {
        document.getElementById('editIndex').value = index;
        if (index > -1) {
            const item = tradingData[index];
            document.getElementById('modalTitle').innerText = "កែប្រែទិន្នន័យ (Edit Day)";
            document.getElementById('inputDay').value = item.day;
            document.getElementById('inputBalance').value = item.balance;
            document.getElementById('inputTarget').value = item.target;
            document.getElementById('inputExpected').value = item.expected;
        } else {
            document.getElementById('modalTitle').innerText = "បន្ថែមថ្ងៃថ្មី (Add New Day)";
            document.getElementById('inputDay').value = '';
            document.getElementById('inputBalance').value = '';
            document.getElementById('inputTarget').value = '';
            document.getElementById('inputExpected').value = '';
        }
        modalOverlay.style.display = 'flex';
    }

    function closeModal() {
        modalOverlay.style.display = 'none';
    }

    function saveRow() {
        const day = parseInt(document.getElementById('inputDay').value);
        const balance = document.getElementById('inputBalance').value;
        const target = document.getElementById('inputTarget').value;
        const expected = document.getElementById('inputExpected').value;
        const editIndex = parseInt(document.getElementById('editIndex').value);

        if (!day || !balance || !target || !expected) {
            alert('សូមបំពេញព័ត៌មានអោយគ្រប់!');
            return;
        }

        const rowData = { day, balance, target, expected };

        if (editIndex > -1) {
            tradingData[editIndex] = rowData;
        } else {
            tradingData.push(rowData);
            tradingData.sort((a, b) => a.day - b.day);
        }

        renderTable();
        closeModal();
    }

    function editRow(index) { openModal(index); }

    function deleteRow(index) {
        if (confirm('តើអ្នកពិតជាចង់លុបជួរនេះមែនទេ?')) {
            const item = tradingData[index];
            delete checkedDays[item.day];
            localStorage.setItem('checkedDays', JSON.stringify(checkedDays));
            tradingData.splice(index, 1);
            renderTable();
        }
    }

    function resetProgress() {
        if (confirm('តើអ្នកចង់ Clear Checkmark ទាំងអស់ឡើងវិញទេ?')) {
            checkedDays = {};
            localStorage.setItem('checkedDays', JSON.stringify(checkedDays));
            renderTable();
        }
    }

    renderTable();
</script>

</body>
</html>
